name: Validate plugin
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - name: Build must be reproducible
        run: git diff --exit-code -- dist
      - name: Install integration test tools
        run: sudo apt-get update -qq && sudo apt-get install -y iproute2 iptables
      - name: Real network namespace integration
        run: bash test/netns.sh
